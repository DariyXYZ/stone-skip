<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>stone skip — logo</title>
<style>
* { margin:0; padding:0; box-sizing:border-box }
html, body { width:630px; height:500px; background:#000; overflow:hidden }
#waves {
  font-family:'Courier New',Courier,monospace;
  font-size:14px;
  line-height:1.18;
  white-space:pre;
  color:#888;
  position:fixed; top:0; left:0;
  user-select:text;
}
#stone-el {
  position:fixed;
  font-family:'Courier New',Courier,monospace;
  font-size:14px;
  line-height:1.18;
  color:#d4c9a8;
  pointer-events:none;
}
#ui {
  position:fixed; bottom:10px; right:12px;
  display:flex; align-items:center; gap:6px; z-index:10;
}
.btn {
  font-family:'Courier New',monospace; font-size:11px;
  color:#333; border:1px solid #1e1e1e; background:#000;
  padding:3px 9px; cursor:pointer; user-select:none;
  letter-spacing:0.05em;
}
.btn:hover { color:#666; border-color:#383838; }
#size-wrap {
  display:flex; align-items:center; gap:5px;
}
#size-label {
  font-family:'Courier New',monospace; font-size:11px;
  color:#2a2a2a; user-select:none; white-space:nowrap;
}
#size-slider {
  -webkit-appearance:none; appearance:none;
  width:72px; height:2px;
  background:#1a1a1a; border:none; outline:none; cursor:pointer;
}
#size-slider::-webkit-slider-thumb {
  -webkit-appearance:none; appearance:none;
  width:8px; height:8px; border-radius:50%;
  background:#333; cursor:pointer;
}
#size-slider::-webkit-slider-thumb:hover { background:#555; }
#size-slider::-moz-range-thumb {
  width:8px; height:8px; border-radius:50%;
  background:#333; border:none; cursor:pointer;
}
#status {
  position:fixed; bottom:10px; left:12px;
  font-family:'Courier New',monospace; font-size:11px;
  color:#222; pointer-events:none;
}
</style>
</head>
<body>
<div id="waves"></div>
<div id="stone-el"></div>
<div id="status"></div>
<div id="ui">
  <div id="size-wrap">
    <span id="size-label">size</span>
    <input id="size-slider" type="range" min="40" max="250" value="130">
  </div>
  <button class="btn" id="btn-copy">copy</button>
  <button class="btn" id="btn-pause">pause</button>
</div>
<script>
// ── Layout ───────────────────────────────────────────────────────────────
const _p = document.createElement('span');
_p.style.cssText = "position:fixed;visibility:hidden;font-family:'Courier New',monospace;font-size:14px;white-space:pre";
_p.textContent = 'M'.repeat(200);
document.body.appendChild(_p);
const CW = _p.getBoundingClientRect().width / 200;
document.body.removeChild(_p);
const CH   = 14 * 1.18;
const COLS = Math.floor(630 / CW);
const ROWS = Math.floor(500 / CH);
const CX   = COLS / 2;
const CY   = ROWS / 2;

// ── Wave constants (logo-tuned) ───────────────────────────────────────────
const SPEED=9, WAVELENGTH=13, DECAY_T=0.22;
const CREST_T=0.82, FADE_LOW=0.16, FADE_ZERO=0.025;
// slider controls this: higher = smaller rings
let DROP_DECAYD = 0.13;

// ── Wave functions — identical to game ───────────────────────────────────
function waveComp(d, px, py, now) {
  const age = now - d.born;
  if (age < 0) return null;
  const dx = px - d.x, dy = (py - d.y) * 2;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 0.5 || age < dist / SPEED) return null;
  const ang = Math.atan2(dy, dx);
  const wob = Math.sin(ang * 2 + d.seed) * 0.7 + Math.sin(ang * 3.1 + d.seed * 1.5) * 0.4;
  const dw  = dist + wob * Math.exp(-dist * 0.05) * 2.2;
  const ph  = (dw - SPEED * age) * (2 * Math.PI / WAVELENGTH);
  const sv  = Math.sin(ph);
  const ev  = Math.exp(-age * DECAY_T) * Math.exp(-dist * d.decayD) * d.str;
  return { sv, ev, dx: px - d.x, dy: py - d.y };
}

function ringChar(dxR, dyR, env, x, y) {
  let tang = (Math.atan2(-dyR, dxR) * 180 / Math.PI + 360) % 180;
  if (tang > 90) tang = 180 - tang;
  const nx = (((x * 127 + y * 311) ^ (x * 53 + y * 19)) & 0xFF) / 255.0;
  if (env > 0.46 && Math.random() < 0.012)
    return ['°','˚','·'][Math.random() * 3 | 0];
  if (env < 0.11 + nx * 0.07) return '˙';
  if (env < 0.20 + nx * 0.08) return '·';
  if (tang < 30) {
    if (env > 0.37 - nx * 0.06) return nx < 0.52 ? '~' : '-';
    return nx < 0.58 ? '·' : '˙';
  }
  return nx < 0.62 ? '·' : '˙';
}

function renderLayer(el, drops, t) {
  const dynCrestT = Math.min(0.93, CREST_T + drops.length * 0.008);
  const rows = [];
  for (let y = 0; y < ROWS; y++) {
    let row = '';
    for (let x = 0; x < COLS; x++) {
      let bW=0, bDx=0, bDy=0;
      for (const d of drops) {
        const c = waveComp(d, x, y, t);
        if (!c || c.sv <= dynCrestT) continue;
        const w = c.sv * c.ev;
        if (w > bW) { bW=w; bDx=c.dx; bDy=c.dy; }
      }
      if (bW > 0) bW *= 0.80 + (((x*127+y*311)^(x*53+y*19))&0xFF)/255.0*0.40;
      if (bW >= FADE_LOW) {
        row += ringChar(bDx, bDy, bW, x, y);
      } else if (bW >= FADE_ZERO) {
        const pp = ((bW-FADE_ZERO)/(FADE_LOW-FADE_ZERO))**5;
        const h  = ((x*374761393+y*668265263)&0x7FFFFFFF)%1000;
        row += h < pp*1000 ? '˙' : ' ';
      } else {
        row += ' ';
      }
    }
    rows.push(row);
  }
  el.textContent = rows.join('\n');
}

// ── Drops ────────────────────────────────────────────────────────────────
const SPAWN      = 1.0;   // animation-seconds between rings
const SPEED_MULT = 0.65;  // animation runs at 65% real speed

let drops     = [];
let t         = 0;
let lastTs    = null;
let nextSpawn = SPAWN;
let paused    = false;

// Pre-seed 3 rings at good radii so they're visible immediately
const seeds = [0.72, 2.14, 4.31];
for (let i = 0; i < 3; i++) {
  drops.push({
    x: CX, y: CY,
    born:    -(i + 1) * SPAWN,
    life:    9,
    str:     1.35,
    decayD:  DROP_DECAYD,
    splashR: 0.42,
    seed:    seeds[i],
  });
}

// ── DOM ──────────────────────────────────────────────────────────────────
const $waves  = document.getElementById('waves');
const $stone  = document.getElementById('stone-el');
const $status = document.getElementById('status');
const $btnP   = document.getElementById('btn-pause');
const $btnC   = document.getElementById('btn-copy');
const $slider = document.getElementById('size-slider');
const $label  = document.getElementById('size-label');

$stone.style.left = (Math.round(CX) * CW) + 'px';
$stone.style.top  = (Math.round(CY) * CH) + 'px';
$stone.textContent = '⬤';

// ── Slider ───────────────────────────────────────────────────────────────
$slider.addEventListener('input', () => {
  DROP_DECAYD = $slider.value / 1000;
  // live-update existing drops so change is visible immediately
  drops.forEach(d => { d.decayD = DROP_DECAYD; });
});

// ── Controls ─────────────────────────────────────────────────────────────
function togglePause() {
  paused = !paused;
  $btnP.textContent = paused ? 'resume' : 'pause';
  $status.textContent = paused ? '■  paused' : '';
  if (!paused) { lastTs = null; requestAnimationFrame(frame); }
}

$btnP.addEventListener('click', togglePause);

$btnC.addEventListener('click', () => {
  const text = $waves.textContent;
  navigator.clipboard.writeText(text).then(() => {
    $btnC.textContent = 'copied!';
    setTimeout(() => { $btnC.textContent = 'copy'; }, 1500);
  }).catch(() => {
    // Fallback: select the text
    const sel = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents($waves);
    sel.removeAllRanges();
    sel.addRange(range);
  });
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
});

// ── Loop ─────────────────────────────────────────────────────────────────
function frame(ts) {
  if (paused) return;
  const dt = lastTs === null ? 0 : Math.min((ts - lastTs) / 1000, 0.1);
  lastTs = ts;
  t += dt * SPEED_MULT;

  nextSpawn -= dt * SPEED_MULT;
  if (nextSpawn <= 0) {
    drops.push({
      x: CX, y: CY,
      born:    t,
      life:    9,
      str:     1.35,
      decayD:  DROP_DECAYD,
      splashR: 0.42,
      seed:    Math.random() * Math.PI * 2,
    });
    nextSpawn = SPAWN;
  }

  drops = drops.filter(d => t - d.born < d.life);
  renderLayer($waves, drops, t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
